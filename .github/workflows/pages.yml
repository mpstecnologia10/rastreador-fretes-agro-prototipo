name: Demonstração estática
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3,9,15,21 * * *'
permissions:
  contents: read
concurrency:
  group: fretes-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 'openpyxl>=3.1,<4' pytest && python -m pytest tests -q
      - uses: actions/cache@v4
        with:
          path: .cache/pncp-opportunities.json
          key: pncp-seen-${{ github.run_id }}
          restore-keys: pncp-seen-
      - name: Atualizar situação viária dos terminais
        env:
          WAZE_AUTHORIZED_FEED_URL: ${{ secrets.WAZE_AUTHORIZED_FEED_URL }}
          WAZE_AGGREGATE_PUBLICATION_ALLOWED: ${{ vars.WAZE_AGGREGATE_PUBLICATION_ALLOWED }}
        run: python -m pipeline.traffic
      - name: update-freights
        run: |
          python -m pipeline.acquisition
          python -m pipeline.fuel || echo "::warning::ANP indisponível; preservada a pesquisa datada do repositório"
          python -m pipeline.pncp
          python -m pipeline.adapters.conab || echo "::warning::Aviso Conab indisponível"
          if [ "${{ github.event_name }}" != "push" ]; then python -m pipeline.build --vitrines; fi
          python -m pipeline.build --include-showcase --public --inputs .cache/automatic-inputs --refresh-ibge --browser-runtime
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
